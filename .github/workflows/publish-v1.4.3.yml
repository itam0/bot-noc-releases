name: Publicar v1.4.3

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.3.yml"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar compilacion validada
        run: |
          curl -L --fail --silent --show-error 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-bfe0-820e-bc62-9d8afa9a9428/raw?se=2026-11-13T15%3A33%3A48Z&sp=r&sv=2026-06-06&sr=b&scid=01a1d584-a82d-72a6-a277-a65319000ce3&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-13T10%3A26%3A17Z&ske=2026-11-14T10%3A26%3A17Z&sks=b&skv=2026-06-06&sig=M9LxZTaDZWTYARQf6E%2BQ/npbodnRvh23DT0OKIgQSrU%3D' -o workflow-artifact.zip
          echo "c0de7f03c7815d2ffc0c5982302e7bd934afb53e639d2c861bfe62cfe07c3d64  workflow-artifact.zip" | sha256sum -c -
          unzip workflow-artifact.zip -d release-files
          echo "37e723fbe1b6a41d1485fa63583533c4c0abdfa8be4e9957d8417493db8a3541  release-files/NubaLith-NOC-v1.4.3.exe" | sha256sum -c -
          echo "efebb6eebc1a4d5b412d072e48dacc5601ca644ee9e88c40413466cfcd84ee1d  release-files/NubaLith-NOC-v1.4.3-windows-x64.zip" | sha256sum -c -

      - name: Publicar version estable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'NOTES'
          Versión estable 1.4.3 de NubaLith NOC.

          - En ACSA y NASA, al usar “Agregar comentario” sobre una máquina virtual reconocida, se ofrecen las opciones Memoria RAM, CPU o comentario manual.
          - La selección puede corregirse aunque el equipo ya haya sido detectado correctamente.
          - Controladores, pórticos y los demás clientes conservan el comentario libre existente.
          - Se respeta la posición configurada localmente para {comentario}; la actualización no sobrescribe las plantillas del operador.
          - Incluye las correcciones OCR y catálogo de la versión 1.4.2.

          Compilación Windows x64 validada con 37 pruebas automatizadas.
          NOTES

          if gh release view v1.4.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.4.3               release-files/NubaLith-NOC-v1.4.3.exe               release-files/NubaLith-NOC-v1.4.3-windows-x64.zip               --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.4.3 --repo "$GITHUB_REPOSITORY"               --title "NubaLith NOC v1.4.3"               --notes-file release-notes.md               --latest
          else
            gh release create v1.4.3               release-files/NubaLith-NOC-v1.4.3.exe               release-files/NubaLith-NOC-v1.4.3-windows-x64.zip               --repo "$GITHUB_REPOSITORY"               --title "NubaLith NOC v1.4.3"               --notes-file release-notes.md               --latest
          fi
