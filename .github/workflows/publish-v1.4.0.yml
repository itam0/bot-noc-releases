name: Publicar NubaLith NOC 1.4.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.4.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar artefacto Windows verificado
        run: curl -L --fail --retry 2 -o build.zip 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1a44-820e-b964-d092f4eeb8b8/raw?se=2026-11-11T01%3A14%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=01a1c826-614f-7d19-b4e3-e0c4e6ac534d&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T22%3A53%3A31Z&ske=2026-11-11T22%3A53%3A31Z&sks=b&skv=2026-02-06&sig=OBXrDyuSdRPMB24qgmQloDGdIvXesojpfhJII9QcFh0%3D'
      - name: Verificar paquete de compilación
        run: echo '8fc15994a419a477aabe7e93e6427d525d3389b3cb2b1ff494ee0eea40b5240e  build.zip' | sha256sum -c -
      - name: Extraer y verificar ejecutables
        run: |
          mkdir release
          unzip build.zip -d release
          cd release
          sed 's/^sha256://' SHA256SUMS.txt | sha256sum -c -
      - name: Crear Release estable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.0 --repo itam0/bot-noc-releases >/dev/null 2>&1; then
            echo 'La Release v1.4.0 ya existe.'
            exit 0
          fi
          cat > notes.md <<'EOF'
          ## Mantenimiento preventivo desde Word

          - Nuevo comando `/mantenimiento` para R78 y R66.
          - Selección de pórtico y sentido Oriente/Poniente para R78.
          - Extracción de imágenes DOCX en el orden original, sin OCR ni IA.
          - Ticket cerrado, tipo Seguimiento, prioridad Urgente y origen seleccionable.

          ## Compatibilidad

          - Conserva el historial consultable completo de 1.3.3.
          - Mantiene ocho filtros, ordenamiento y enlaces directos de Freshdesk.
          - No elimina configuración, clientes, firmas, historial ni la versión 1.3.3.
          - 31 pruebas automatizadas y compilación Windows correctas.

          ## Verificación

          - SHA-256 EXE: `A02D258AF2BDA4B21C113AD950F81515E39A44B93F8C7E374E9F0004189552CC`
          - SHA-256 ZIP: `2313143AA3CCEC0976307FBE2404CF4700B2259288E8083D0200DE3BC60BEE60`
          EOF
          gh release create v1.4.0 \
            release/NubaLith-NOC-v1.4.0.exe \
            release/NubaLith-NOC-v1.4.0-windows-x64.zip \
            --repo itam0/bot-noc-releases \
            --title 'NubaLith NOC 1.4.0' \
            --notes-file notes.md \
            --latest
