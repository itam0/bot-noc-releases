name: Publicar NubaLith NOC v1.4.1

on:
  push:
    paths:
      - ".github/workflows/publish-v1.4.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto compilado y verificable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3e8c-820e-86f5-4926d4d7efa8/raw?se=2026-11-12T12%3A53%3A16Z&sp=r&sv=2026-06-06&sr=b&scid=01a1cfbc-f16c-72c2-a1e8-6ef55f72e3f6&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-12T12%3A22%3A20Z&ske=2026-11-13T12%3A22%3A20Z&sks=b&skv=2026-06-06&sig=3b/%2BUioBFrhRy/EUMQ2agMUnHVGW0s/G0mWslIcBEKg%3D' -o workflow-artifact.zip
          echo 'babe68587ddc0921d1835a513c45409a1eb8da5114166d9047c21631b328af1b  workflow-artifact.zip' | sha256sum -c -
          unzip -q workflow-artifact.zip -d release
          echo '3a4b58aeb94db04ab447943aae9f1e3d68fc5c25693ab7d4b498bfbbf025a99f  release/NubaLith-NOC-v1.4.1.exe' | sha256sum -c -
          echo '865a21869b02a6d550380afddfefe309a6dae42b9abc9d68da117ba2f3397aed  release/NubaLith-NOC-v1.4.1-windows-x64.zip' | sha256sum -c -
          unzip -t release/NubaLith-NOC-v1.4.1-windows-x64.zip >/dev/null

      - name: Crear publicación estable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión v1.4.1 ya existe; se detiene para no reemplazar archivos."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## NubaLith NOC 1.4.1

          - Corrección guiada de equipos para ACSA y NASA: sugerencias OCR, catálogo paginado o edición manual.
          - Catálogos independientes de controladores/pórticos y máquinas virtuales para cada cliente.
          - Para VM, selección rápida del motivo Memoria RAM, CPU o comentario manual.
          - El asunto continúa corto; el motivo de VM se agrega al cuerpo del ticket.
          - ACSA sigue siendo el cliente predeterminado al enviar una imagen nueva.
          - Portal/Web continúa como origen predeterminado de Freshdesk.
          - Los demás clientes, el mantenimiento y el tratamiento universal de imágenes no cambian.

          La versión 1.4.0 continúa disponible para volver atrás si fuera necesario.
          EOF
          gh release create v1.4.1             release/NubaLith-NOC-v1.4.1.exe             release/NubaLith-NOC-v1.4.1-windows-x64.zip             --repo "$GITHUB_REPOSITORY"             --title "NubaLith NOC v1.4.1"             --notes-file release-notes.md             --latest
